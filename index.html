<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASCII 3D Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/styles/global.css" />
  </head>
  <body>
    <div id="app"></div>

    <div id="hud">
      <div id="crosshair">+</div>
      <div id="fps">FPS: 0</div>
      <div id="battery-ui">
        <div class="battery-label">LAMP BATTERY <span id="battery-text">100%</span></div>
        <div class="battery-bar-container">
          <div id="battery-bar"></div>
        </div>
      </div>
    </div>

    <div id="instructions">
      <h1>ASCII Explorer</h1>
      <p>Click to Start</p>
      <p>W, A, S, D = Move<br>Mouse = Look<br>Shift = Sprint</p>
    </div>

    <div id="terminal" style="display: none;">
      <div id="terminal-output"></div>
      <div class="terminal-input-line">
        <span class="prompt">&gt;</span>
        <input type="text" id="terminal-input" autocomplete="off" spellcheck="false" />
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
